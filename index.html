<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="flex flex-col items-center gap-10 h-dvh w-full text-white">
      <div class="w-[200px] h-[200px] bg-green-500 rectangle text-center flex items-center justify-center">
        gsap.to
      </div>
      <div class="w-[200px] h-[200px] bg-black rounded-full circle text-center flex items-center justify-center">
        gsap.from
      </div>
      <div class="w-[200px] h-[200px] bg-purple-900 square text-center flex items-center justify-center">
gsap.fromTo
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
      gsap.to(".rectangle", {
        rotation: 360,
        duration: 1,
        ease: "power2.out",  
      });
      gsap.from(".circle", {
        opacity: 0,
        scale: 0,
        duration: 1,
        delay: 0.3,
        ease: "power2.inOut(1.7)"
      });
      gsap.fromTo(
        ".square",
        { opacity: 0, y: -50, scale: 0.5 },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 1,
          delay: 0.9,
          ease: "power3.out",
        }
      );
    </script>
</html>
